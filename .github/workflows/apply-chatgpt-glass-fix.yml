name: Apply ChatGPT Glass fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-chatgpt-glass-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply validated patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: 712a3b177c64f6f01b981ca92aa527d7785755bd
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/$PATCH_BLOB" \
            | python3 -c 'import sys,json,base64; print(base64.b64decode(json.load(sys.stdin)["content"]).decode(), end="")' > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          node --check chatgpt-glass.user.js
          rm .github/workflows/apply-chatgpt-glass-fix.yml
          git config user.name "Owen Liu"
          git config user.email "64713824+owenliu0924@users.noreply.github.com"
          git add chatgpt-glass.user.js .github/workflows/apply-chatgpt-glass-fix.yml
          git commit -m "Fix glass menus and file preview"
          git push origin HEAD:main
